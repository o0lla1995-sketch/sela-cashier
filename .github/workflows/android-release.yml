name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install JS dependencies
        run: npm ci

      - name: Run tests (cart + API client)
        run: npx jest --ci --silent

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Release build signed with the debug key (installable) — the
      # cashier app ships outside the Play Store.
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Derive versioned APK name
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APK_NAME="SelaCashier-${GITHUB_REF_NAME}"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            APK_NAME="SelaCashier-dev-${SHORT_SHA}"
          fi
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "/tmp/${APK_NAME}.apk"
          ls -la /tmp/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: /tmp/${{ steps.version.outputs.apk_name }}.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "/tmp/${{ steps.version.outputs.apk_name }}.apk#سيلّا كاشير $GITHUB_REF_NAME (APK)" \
            --title "سيلّا كاشير Sela Cashier $GITHUB_REF_NAME" \
            --generate-notes
